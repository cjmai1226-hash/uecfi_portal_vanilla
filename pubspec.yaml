name: uecfi_portal_vanilla
description: "Uecfi Portal for Android"
publish_to: 'none'
version: 2.2.1+22

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  sqflite: ^2.4.1
  path: ^1.9.1
  firebase_core: ^3.12.1
  cloud_firestore: ^5.6.5
  firebase_auth: ^5.5.1
  firebase_storage: ^12.4.4
  cached_network_image: ^3.4.1
  intl: ^0.20.2
  philippines_rpcmb: ^0.0.3
  image_picker: ^1.2.3
  crop_your_image: ^1.1.0
  file_picker: ^8.1.6
  shared_preferences: ^2.3.5
  image: ^4.2.0
  hugeicons: ^1.2.0
  google_fonts: ^8.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/uecfi_pmm_logo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/uecfi_pmm_logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/forms/
    - assets/db/

